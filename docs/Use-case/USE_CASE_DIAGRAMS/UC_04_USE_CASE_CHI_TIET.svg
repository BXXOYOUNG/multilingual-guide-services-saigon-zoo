  <text x="65" y="1047.0" fill="#344054" font-family="Arial, sans-serif" font-size="20" text-anchor="start" font-weight="400">
    <tspan x="65" y="1004.1999999999999">LUỒNG CHÍNH: Quét hoặc nhập TCV-POI:ObjectId → kiểm tra định dạng → tìm bản thu đúng ngôn ngữ → phát.</tspan>
    <tspan x="65" y="1029.0">A1 — Ưu tiên bản đã tải để nghe ngoại tuyến; nếu không có</tspan>
    <tspan x="65" y="1053.8">A2 — TCV-PACKAGE:ObjectId chuyển sang tải gói UC-05, không bị hiểu thành POI</tspan>
    <tspan x="65" y="1078.6">E1 — Mã sai/camera không có quyền/audio thiếu: thông báo; không tự gọi TTS</tspan>
    <tspan x="65" y="1103.3999999999999">GHI CHÚ: Không cần GPS. Camera cần secure context và quyền; nhập mã thủ công vẫn dùng được. Không tự chọn audio khác ngôn ngữ hoặc dịch máy cho khách.</tspan>
  </text>
  <text x="65" y="1169.5" fill="#667085" font-family="Arial, sans-serif" font-size="18" text-anchor="start" font-weight="400">
    <tspan x="65" y="1175.62">Nét đứt/mũi tên mở: «include» hoặc «extend» · Tam giác rỗng: chuyên biệt → khái quát · Phạm vi hiện hành; A/E xem đặc tả đi kèm.</tspan>
  </text>
