  <text x="65" y="1199.0" fill="#344054" font-family="Arial, sans-serif" font-size="20" text-anchor="start" font-weight="400">
    <tspan x="65" y="1156.2">LUỒNG CHÍNH: Xem danh sách → chọn đối tượng → tìm audio cục bộ → hiển thị thông tin → nghe không cần Internet.</tspan>
    <tspan x="65" y="1181.0">A1 — Mở rộng tại điểm đang xem/nghe: đổi đối tượng, dừng audio cũ</tspan>
    <tspan x="65" y="1205.8">E1 — Chưa có bản thu phù hợp hoặc dữ liệu cục bộ lỗi:</tspan>
    <tspan x="65" y="1230.6000000000001">GHI CHÚ: Điều kiện: mở app và tải audio trước trên cùng origin/browser. Không cần gọi server để phát Blob đã tải. Ảnh, metadata và nền map chỉ có theo dữ</tspan>
    <tspan x="65" y="1255.4">liệu đã cache; không bắt UC-05 chạy lại ở mỗi lần nghe.</tspan>
  </text>
  <text x="65" y="1321.5" fill="#667085" font-family="Arial, sans-serif" font-size="18" text-anchor="start" font-weight="400">
    <tspan x="65" y="1327.62">Nét đứt/mũi tên mở: «include» hoặc «extend» · Tam giác rỗng: chuyên biệt → khái quát · Phạm vi hiện hành; A/E xem đặc tả đi kèm.</tspan>
