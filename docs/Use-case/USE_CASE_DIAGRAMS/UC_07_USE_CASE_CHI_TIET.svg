  <text x="65" y="829.0" fill="#344054" font-family="Arial, sans-serif" font-size="20" text-anchor="start" font-weight="400">
    <tspan x="65" y="786.1999999999999">LUỒNG CHÍNH: Kiểm tra phiên → nếu cần, nhập thông tin và xác thực → tạo phiên → vào khu vực quản trị.</tspan>
    <tspan x="65" y="810.9999999999999">A1 — Biến thể “Sử dụng phiên hợp lệ” truy cập khu vực quản</tspan>
    <tspan x="65" y="835.8">E1 — Sai tài khoản/mật khẩu, phiên hết hạn hoặc tài khoản không hoạt</tspan>
    <tspan x="65" y="860.5999999999999">E2 — Backend/Redis lỗi hoặc rate limit: báo lỗi và cho thử lại sau</tspan>
    <tspan x="65" y="885.4">GHI CHÚ: Cookie HTTP-only; session Redis 8 giờ; backend kiểm tra role/permission cho từng request. Hết phiên hoặc không đủ quyền thì không mở chức năng quản trị; chưa có UI quản lý tài khoản/role.</tspan>
  </text>
  <text x="65" y="951.5" fill="#667085" font-family="Arial, sans-serif" font-size="18" text-anchor="start" font-weight="400">
    <tspan x="65" y="957.62">Nét đứt/mũi tên mở: «include» hoặc «extend» · Tam giác rỗng: chuyên biệt → khái quát · Phạm vi hiện hành; A/E xem đặc tả đi kèm.</tspan>
  </text>
