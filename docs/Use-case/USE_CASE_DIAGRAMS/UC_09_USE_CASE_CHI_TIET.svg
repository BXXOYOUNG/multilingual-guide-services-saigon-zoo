  <text x="65" y="1654.0" fill="#344054" font-family="Arial, sans-serif" font-size="20" text-anchor="start" font-weight="400">
    <tspan x="65" y="1561.6">LUỒNG CHÍNH: Chọn POI/ngôn ngữ → lưu thủ công hoặc Chrome preview/đối chiếu/xác nhận → admin yêu cầu TTS từng ngôn ngữ → nghe thử → phát hành gói mới khi cần.</tspan>
    <tspan x="65" y="1586.3999999999999">A1 — Nhập/sửa thủ công, có thể chỉ lưu văn bản</tspan>
    <tspan x="65" y="1611.1999999999998">A2 — Theo dõi hoặc tạo lại audio, nghe thử khi Completed</tspan>
    <tspan x="65" y="1636.0">A3 — Chrome desktop: lưu nguồn → chuẩn bị preview → bấm dịch →</tspan>
    <tspan x="65" y="1660.8">E1 — Browser/cặp ngôn ngữ không hỗ trợ hoặc tải mô hình lỗi: nhập</tspan>
    <tspan x="65" y="1685.6">E2 — Preview hết hạn hoặc nguồn/đích đổi: từ chối 409, chuẩn bị mới</tspan>
    <tspan x="65" y="1710.3999999999999">E3 — TTS lỗi: báo Failed và admin chủ động yêu cầu lại</tspan>
    <tspan x="65" y="1735.1999999999998">GHI CHÚ: 6 ngôn ngữ tổng cộng, tối đa 5 đích. Không Cloud API key. Redis giữ nguồn/revision 30 phút; bản dịch mới ở bộ nhớ React trước commit. Lưu lời đổi vô hiệu audio; POI active cho đọc ngay sau lưu. TTS không tự chạy do</tspan>
    <tspan x="65" y="1760.0">bấm dịch. Gói cũ không tự cập nhật.</tspan>
  </text>
  <text x="65" y="1828.5" fill="#667085" font-family="Arial, sans-serif" font-size="18" text-anchor="start" font-weight="400">
    <tspan x="65" y="1834.62">Nét đứt/mũi tên mở: «include» hoặc «extend» · Tam giác rỗng: chuyên biệt → khái quát · Phạm vi hiện hành; A/E xem đặc tả đi kèm.</tspan>
