  <text x="65" y="1680.0" fill="#344054" font-family="Arial, sans-serif" font-size="20" text-anchor="start" font-weight="400">
    <tspan x="65" y="1624.8">LUỒNG CHÍNH: Bật tự phát → nhận vị trí → xét vùng tròn → chọn bản thu đúng ngôn ngữ → phát nếu trình duyệt cho phép.</tspan>
    <tspan x="65" y="1649.6">A1 — Mô phỏng tại POI dùng audio đã chuẩn bị, không đòi hỏi</tspan>
    <tspan x="65" y="1674.3999999999999">A2 — Rời vùng/đổi POI dừng audio tự phát</tspan>
    <tspan x="65" y="1699.2">E1 — Thiếu audio, GPS/quyền/API lỗi hoặc autoplay bị chặn: thông báo và cho</tspan>
    <tspan x="65" y="1724.0">GHI CHÚ: Không có TTS fallback cho khách, không đọc playback_history để đặt cooldown. Nhánh GPS thật resolve audio qua API online; nghe thủ công/mô phỏng có thể</tspan>
    <tspan x="65" y="1748.8">dùng bản đã tải. Autoplay và tab nền phụ thuộc browser.</tspan>
  </text>
  <text x="65" y="1815.5" fill="#667085" font-family="Arial, sans-serif" font-size="18" text-anchor="start" font-weight="400">
    <tspan x="65" y="1821.62">Nét đứt/mũi tên mở: «include» hoặc «extend» · Tam giác rỗng: chuyên biệt → khái quát · Phạm vi hiện hành; A/E xem đặc tả đi kèm.</tspan>
  </text>
