  <text x="65" y="1378.0" fill="#344054" font-family="Arial, sans-serif" font-size="20" text-anchor="start" font-weight="400">
    <tspan x="65" y="1335.2">LUỒNG CHÍNH: Xem danh sách → thêm/sửa/ẩn → lưu POI → lưu ảnh và vùng bằng request riêng khi cần.</tspan>
    <tspan x="65" y="1360.0">A1 — Tạo POI kèm bản ngôn ngữ đầu tiên, mặc định ẩn</tspan>
    <tspan x="65" y="1384.8">A2 — Đổi ảnh/tọa độ/bán kính/trạng thái; tọa độ POI cập nhật tâm vùng</tspan>
    <tspan x="65" y="1409.6000000000001">A3 — Ẩn POI, giữ dữ liệu/audio/gói cũ; không xóa cứng</tspan>
    <tspan x="65" y="1434.4">GHI CHÚ: Ảnh upload JPEG/PNG/WebP ≤5 MB, ≤16 MP. Bán kính 5–500 m. Không vẽ polygon. Các bước form không chung một transaction. Thêm POI không tự tạo đủ bản dịch/audio; tiếp tục UC-09.</tspan>
  </text>
  <text x="65" y="1500.5" fill="#667085" font-family="Arial, sans-serif" font-size="18" text-anchor="start" font-weight="400">
    <tspan x="65" y="1506.62">Nét đứt/mũi tên mở: «include» hoặc «extend» · Tam giác rỗng: chuyên biệt → khái quát · Phạm vi hiện hành; A/E xem đặc tả đi kèm.</tspan>
  </text>
