  <text x="65" y="1228.0" fill="#344054" font-family="Arial, sans-serif" font-size="20" text-anchor="start" font-weight="400">
    <tspan x="65" y="1172.8">LUỒNG CHÍNH: Mở dashboard → kiểm tra quyền → tổng hợp từ sự kiện đã nhận → xem thiết bị, phiên, audio, ngôn ngữ và điểm nổi bật.</tspan>
    <tspan x="65" y="1197.6">A1 — Làm mới theo nút hoặc tự động mỗi 60 giây</tspan>
    <tspan x="65" y="1222.3999999999999">E1 — Hết phiên/thiếu quyền/API lỗi: báo lỗi, không giả số liệu</tspan>
    <tspan x="65" y="1247.2">E2 — Chưa có sự kiện: hiển thị trạng thái trống/0</tspan>
    <tspan x="65" y="1272.0">GHI CHÚ: Thiết bị hoạt động: có sự kiện 5 phút gần nhất; visits là phiên bắt đầu, không phải người thật. Mốc ngày/giờ UTC; ngôn ngữ theo sự kiện.</tspan>
    <tspan x="65" y="1296.8">Chưa có heatmap, lịch sử tuyến hoặc queue đồng bộ analytics offline.</tspan>
  </text>
  <text x="65" y="1363.5" fill="#667085" font-family="Arial, sans-serif" font-size="18" text-anchor="start" font-weight="400">
