    <tspan x="65" y="914.9999999999999">GHI CHÚ: 6 ngôn ngữ vi/en/fr/zh-Hans/ja/ko. Đây là chọn ngôn ngữ hiển thị, không phải dịch máy nội dung POI.</tspan>
