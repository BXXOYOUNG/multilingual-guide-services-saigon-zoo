  <text fill="#182230" font-family="Arial, sans-serif" font-size="20" text-anchor="middle">
    <tspan x="1929.5" y="758.6625" font-weight="700">Hủy tải và khôi phục dữ</tspan>
    <tspan x="1929.5" y="783.4625" font-weight="400">liệu trước tải</tspan>
  </text>
  <text x="65" y="1204.0" fill="#344054" font-family="Arial, sans-serif" font-size="20" text-anchor="start" font-weight="400">
    <tspan x="65" y="1161.2">LUỒNG CHÍNH: Chọn gói → lấy manifest → tải/kiểm tra từng bản thu → lưu IndexedDB → báo hoàn tất.</tspan>
    <tspan x="65" y="1186.0">A1 — Gói đã tải vẫn có thể được tải lại; client giữ dữ</tspan>
    <tspan x="65" y="1210.8">A2 — Manifest chưa xác minh toàn bộ checksum cần người dùng xác nhận</tspan>
    <tspan x="65" y="1235.6000000000001">E1 — Thiếu dung lượng, checksum/size sai, lỗi mạng hoặc hủy: không ghi nhận</tspan>
    <tspan x="65" y="1260.4">GHI CHÚ: Một gói/một ngôn ngữ, không phải ZIP. Chỉ kiểm tra checksum khi có SHA-256 hợp lệ; không cam kết đủ dung lượng nếu browser không cung cấp estimate. Mô hình Chrome dịch không thuộc gói audio.</tspan>
  </text>
  <text x="65" y="1326.5" fill="#667085" font-family="Arial, sans-serif" font-size="18" text-anchor="start" font-weight="400">
    <tspan x="65" y="1332.62">Nét đứt/mũi tên mở: «include» hoặc «extend» · Tam giác rỗng: chuyên biệt → khái quát · Phạm vi hiện hành; A/E xem đặc tả đi kèm.</tspan>
  </text>
