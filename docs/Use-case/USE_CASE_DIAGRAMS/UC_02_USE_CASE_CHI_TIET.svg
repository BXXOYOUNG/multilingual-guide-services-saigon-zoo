  </text>
  <text x="65" y="910.0" fill="#344054" font-family="Arial, sans-serif" font-size="20" text-anchor="start" font-weight="400">
    <tspan x="65" y="867.1999999999999">LUỒNG CHÍNH: Mở bản đồ → lấy dữ liệu POI → hiển thị POI → lấy vị trí và làm nổi bật điểm gần nhất khi có GPS.</tspan>
    <tspan x="65" y="891.9999999999999">A1 — Không có GPS: vẫn hiển thị POI, không thực hiện phần mở</tspan>
    <tspan x="65" y="916.8">A2 — Mở rộng việc lấy dữ liệu bằng dữ liệu POI đã lưu</tspan>
    <tspan x="65" y="941.5999999999999">E1 — API lỗi và không có cache đúng ngôn ngữ: hiển thị lỗi</tspan>
    <tspan x="65" y="966.4">GHI CHÚ: POI chỉ hiển thị khi active và có bản đúng ngôn ngữ. Cache tách ngôn ngữ; nền OSM online không được bảo đảm ngoại tuyến. GPS không bắt buộc để xem POI.</tspan>
  </text>
  <text x="65" y="1032.5" fill="#667085" font-family="Arial, sans-serif" font-size="18" text-anchor="start" font-weight="400">
    <tspan x="65" y="1038.62">Nét đứt/mũi tên mở: «include» hoặc «extend» · Tam giác rỗng: chuyên biệt → khái quát · Phạm vi hiện hành; A/E xem đặc tả đi kèm.</tspan>
  </text>
</svg>
